name: CI

on:
    pull_request:
        branches: [main]
    workflow_call:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow_ref }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

env:
    GIT_CONFIG_COUNT: 1
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: main

jobs:
    test:
        runs-on: macos-26
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 1
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable
            - name: Install XcodeGen
              run: brew install xcodegen
            - run: xcodegen generate
            - name: Build and test
              run: |
                  set -o pipefail
                  xcodebuild -project CursorProMax.xcodeproj -scheme CursorProMax -destination "platform=macOS" build test CODE_SIGNING_ALLOWED=NO | xcbeautify

    tools:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 1
            - uses: actions/setup-go@v7
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.mod
            - run: go vet ./...
              working-directory: tools
