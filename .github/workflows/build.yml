name: Build

on:
    workflow_call:
        inputs:
            version:
                type: string
                required: true

env:
    GIT_CONFIG_COUNT: 1
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: main
    SPARKLE_VERSION: 2.10.0

jobs:
    build:
        runs-on: macos-26
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable
            - uses: actions/setup-go@v7
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.mod
            - run: go run ./tools/cmd/set-version ${{ inputs.version }}
            - name: Install XcodeGen
              run: brew install xcodegen
            - run: xcodegen generate

            - name: Archive the app
              run: |
                  set -o pipefail
                  xcodebuild archive \
                    -project CursorProMax.xcodeproj \
                    -scheme CursorProMax \
                    -configuration Release \
                    -archivePath build/CursorProMax.xcarchive \
                    -destination "generic/platform=macOS" \
                    CODE_SIGNING_ALLOWED=NO | xcbeautify
                  cp -R build/CursorProMax.xcarchive/Products/Applications/CursorProMax.app build/CursorProMax.app

            - name: Register the bundle ID
              env:
                  KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
                  BUNDLE_IDENTIFIER: dev.adrian.cursorpromax
              run: go run ./tools/cmd/register-bundle-id

            - name: Fetch Signing Assets
              uses: castdrian/setup-apple-certificate@main
              id: cert
              with:
                  app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
                  distribution-private-key: ${{ secrets.DISTRIBUTION_PRIVATE_KEY_BASE64 }}
                  bundle-identifier: dev.adrian.cursorpromax
                  certificate-type: DEVELOPER_ID

            - name: Install Signing Assets
              env:
                  P12_FILE_BASE64: ${{ steps.cert.outputs.p12-certificate-base64 }}
                  P12_PASSWORD: ${{ steps.cert.outputs.p12-password }}
              run: |
                  KEYCHAIN_PATH="$RUNNER_TEMP/cursorpromax-signing.keychain-db"
                  KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
                  P12_PATH="$RUNNER_TEMP/cursorpromax-signing.p12"
                  echo "$P12_FILE_BASE64" | base64 --decode > "$P12_PATH"
                  security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security import "$P12_PATH" -k "$KEYCHAIN_PATH" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security -P "$P12_PASSWORD"
                  security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
                  rm -f "$P12_PATH"

            - name: Sign the app and Sparkle
              env:
                  IDENTITY: ${{ steps.cert.outputs.codesign-identity }}
              run: |
                  APP=build/CursorProMax.app
                  SPARKLE="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"
                  sign() {
                    codesign --force --options runtime --timestamp --sign "$IDENTITY" "$@"
                  }
                  sign "$SPARKLE/XPCServices/Downloader.xpc"
                  sign "$SPARKLE/XPCServices/Installer.xpc"
                  sign "$SPARKLE/Updater.app"
                  sign "$SPARKLE/Autoupdate"
                  sign "$APP/Contents/Frameworks/Sparkle.framework"
                  sign "$APP"
                  codesign --verify --deep --strict --verbose=2 "$APP"

            - name: Package the DMG
              env:
                  VERSION: ${{ inputs.version }}
                  IDENTITY: ${{ steps.cert.outputs.codesign-identity }}
              run: |
                  mkdir -p dist build/dmg
                  cp -R build/CursorProMax.app build/dmg/
                  ln -s /Applications build/dmg/Applications
                  DMG="dist/CursorProMax-$VERSION.dmg"
                  hdiutil create -volname "CursorProMax" -srcfolder build/dmg -ov -format UDZO "$DMG"
                  codesign --force --timestamp --sign "$IDENTITY" "$DMG"

            - name: Notarize and staple the DMG
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  trap 'rm -f /tmp/notary_key.p8' EXIT
                  echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}" | base64 --decode > /tmp/notary_key.p8
                  DMG="dist/CursorProMax-$VERSION.dmg"
                  xcrun notarytool submit "$DMG" \
                    --key /tmp/notary_key.p8 \
                    --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
                    --issuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
                    --wait
                  xcrun stapler staple "$DMG"

            - name: Generate the Sparkle appcast
              env:
                  VERSION: ${{ inputs.version }}
                  EDDSA_PRIVATE_KEY: ${{ secrets.EDDSA_PRIVATE_KEY }}
              run: |
                  curl -fsSL -o sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
                  mkdir -p sparkle update
                  tar -xJf sparkle.tar.xz -C sparkle
                  cp "dist/CursorProMax-$VERSION.dmg" update/
                  echo "$EDDSA_PRIVATE_KEY" | ./sparkle/bin/generate_appcast \
                    --ed-key-file - \
                    --download-url-prefix "https://github.com/castdrian/CursorProMax/releases/download/v$VERSION/" \
                    --link "https://github.com/castdrian/CursorProMax/releases/tag/v$VERSION" \
                    update/

            - uses: actions/upload-artifact@v7
              with:
                  name: release
                  path: dist/*.dmg

            - uses: actions/upload-artifact@v7
              with:
                  name: appcast
                  path: update/appcast.xml

            - name: Remove Signing Assets
              if: always()
              run: security delete-keychain "$RUNNER_TEMP/cursorpromax-signing.keychain-db" || true

