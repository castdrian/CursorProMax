<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E6BFF"/>
      <stop offset="0.55" stop-color="#9B4DFF"/>
      <stop offset="1" stop-color="#FF4FA0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.26" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrowFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECE8FF"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2A0A5E" flood-opacity="0.45"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <path id="arrow" d="M0,0 L0,16.6 L4.1,12.7 L7,19.5 L10,18.2 L7.2,11.6 L12.8,11.6 Z" stroke-linejoin="round" stroke-linecap="round"/>
  </defs>
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#background)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <use xlink:href="#arrow" transform="translate(300 250) scale(38)" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="0.42"/>
    <use xlink:href="#arrow" transform="translate(315 262) scale(32.5)" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.46"/>
    <use xlink:href="#arrow" transform="translate(330 274) scale(27.5)" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="0.5"/>
    <g filter="url(#shadow)">
      <use xlink:href="#arrow" transform="translate(345 286) scale(22.5)" fill="url(#arrowFill)" stroke="#1B1035" stroke-width="0.95"/>
    </g>
  </g>
</svg>
