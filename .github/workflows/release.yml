name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: release
    cancel-in-progress: false

env:
    GIT_CONFIG_COUNT: 1
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: main
    SEMANTIC_RELEASE: >-
        npx --yes
        -p semantic-release@25
        -p @semantic-release/changelog@7
        -p @semantic-release/exec@7
        -p @semantic-release/git@11
        -p conventional-changelog-conventionalcommits@9
        semantic-release

jobs:
    checks:
        uses: ./.github/workflows/ci.yml

    version:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            version: ${{ steps.next.outputs.version }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
            - name: Work out the next version
              id: next
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  $SEMANTIC_RELEASE --dry-run --no-ci
                  if [ -f .next-version ]; then
                    echo "version=$(cat .next-version)" >> "$GITHUB_OUTPUT"
                  fi

    build:
        needs: version
        if: needs.version.outputs.version != ''
        uses: ./.github/workflows/build.yml
        with:
            version: ${{ needs.version.outputs.version }}
        secrets: inherit

    publish:
        needs: [checks, version, build]
        runs-on: ubuntu-latest
        outputs:
            published: ${{ steps.released.outputs.published }}
        permissions:
            contents: write
            issues: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-go@v7
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.mod
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
            - uses: actions/download-artifact@v8
              with:
                  name: release
                  path: dist
            - name: Publish the release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GIT_AUTHOR_NAME: github-actions[bot]
                  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
                  GIT_COMMITTER_NAME: github-actions[bot]
                  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
              run: $SEMANTIC_RELEASE
            - name: Confirm the release was published
              id: released
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ needs.version.outputs.version }}
              run: |
                  if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                    echo "published=true" >> "$GITHUB_OUTPUT"
                  fi

    pages:
        needs: publish
        if: needs.publish.outputs.published == 'true'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: appcast
                  path: site
            - uses: actions/configure-pages@v6
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: site
            - id: deployment
              uses: actions/deploy-pages@v5
