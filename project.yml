name: CursorProMax
options:
  bundleIdPrefix: dev.adrian
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: L988J7YMK5
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: NO
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  CursorProMax:
    type: application
    platform: macOS
    sources:
      - path: CursorProMax
    dependencies:
      - package: Sparkle
    info:
      path: CursorProMax/Info.plist
      properties:
        CFBundleDisplayName: CursorProMax
        CFBundleName: CursorProMax
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        SUFeedURL: https://castdrian.github.io/CursorProMax/appcast.xml
        SUPublicEDKey: 3yIFlTzna9x97d+foS1tLAEjhQvaCZdk94VCSgzRyK8=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_NAME: CursorProMax
        PRODUCT_BUNDLE_IDENTIFIER: dev.adrian.cursorpromax
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
    scheme:
      testTargets:
        - CursorProMaxTests
  CursorProMaxTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CursorProMaxTests
    dependencies:
      - target: CursorProMax
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.adrian.cursorpromax.tests
        GENERATE_INFOPLIST_FILE: YES
